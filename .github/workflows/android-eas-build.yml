name: Android EAS Preview Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android-eas-build.yml"

permissions:
  contents: read

concurrency:
  group: android-eas-preview
  cancel-in-progress: false

jobs:
  android-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify EAS project is linked
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const config = JSON.parse(execFileSync("npx", ["expo", "config", "--json"], { encoding: "utf8" }));
          const projectId = config.extra?.eas?.projectId || "";
          if (!projectId) {
            console.error("Missing extra.eas.projectId in resolved Expo config.");
            process.exit(1);
          }
          console.log("Verified EAS project ID:", projectId);
          NODE

      - name: Run Expo diagnostics
        run: npx expo-doctor

      - name: Verify Expo authentication
        run: npx eas-cli@latest whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android preview APK
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
