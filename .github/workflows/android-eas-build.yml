name: Android EAS Preview Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android-eas-build.yml"

permissions:
  contents: read

concurrency:
  group: android-eas-preview
  cancel-in-progress: false

jobs:
  android-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Verify EAS project is linked
        run: |
          node -e "const c=require('./app.json'); if (!c.expo?.extra?.eas?.projectId) { console.error('Missing expo.extra.eas.projectId. Run npx eas-cli@latest project:init in mobile/ and commit mobile/app.json.'); process.exit(1); }"

      - name: Run Expo diagnostics
        run: npx expo-doctor

      - name: Verify Expo authentication
        run: npx eas-cli@latest whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android preview APK
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
