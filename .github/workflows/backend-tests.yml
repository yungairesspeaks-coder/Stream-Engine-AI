name: Backend audit tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - run: node --check src/server.js
      - run: node --check src/ai.js
      - run: node --check src/promotion.js
      - run: node --check public/app.js
      - run: npm test
