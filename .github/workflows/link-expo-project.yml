name: Link Expo project
# Manual rerun trigger: 2026-11-20

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/link-expo-project.yml"
      - "mobile/app.json"

permissions:
  contents: write

concurrency:
  group: link-expo-project
  cancel-in-progress: false

jobs:
  link-expo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN repository secret."
            exit 1
          fi
          npx --yes eas-cli@latest whoami

      - name: Verify resolved EAS project ID
        id: verify
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const config = JSON.parse(execFileSync("npx", ["expo", "config", "--json"], { encoding: "utf8" }));
          const projectId = config.extra?.eas?.projectId || "";
          if (!projectId) {
            console.error("::error::Resolved Expo config has no extra.eas.projectId.");
            process.exit(1);
          }
          console.log("EAS project ID verified:", projectId);
          require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `project_id=${projectId}\n`);
          NODE

      - name: Commit project ID to main
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/app.json
          if git diff --cached --quiet; then
            echo "mobile/app.json already contains the linked EAS project ID."
          else
            git commit -m "Link Expo project"
            git push origin HEAD:main
          fi
